<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>EditPanel — preview</title>
<style>body{padding:16px;background:var(--paper)}</style></head>
<body>
<div class="editor"><div class="ed-panel"><div class="ed-top"><button class="box lbl" type="button">Huỷ</button><b class="lbl">Sửa thông tin sách</b><button class="lbl btn-read" type="button">Lưu</button></div>
<div class="ed-body"><div class="ed-cover"><div class="cv"><svg viewBox="0 0 600 900" width="100%" height="100%" style="display:block"><rect width="600" height="900" style="fill:var(--cover-cream)"/><circle cx="300" cy="380" r="190" style="fill:var(--cobalt)"/><circle cx="300" cy="380" r="110" style="fill:var(--verm)"/><rect x="0" y="0" width="34" height="900" style="fill:var(--cover-ink);opacity:.12"/></svg></div><div class="ed-src"><button class="box lbl" type="button">Tải ảnh lên</button><button class="box lbl" type="button">Link ảnh</button><button class="box lbl" type="button">Tìm trên mạng</button><button class="box lbl" type="button">Chọn trang PDF</button><button class="box lbl" type="button">Bìa gốc từ file</button><button class="box lbl on" type="button">Bìa tự vẽ</button><p class="ed-note">Hoặc dán ảnh (Ctrl+V) hay kéo thả ảnh vào đây.</p></div></div>
<label class="field"><span class="lbl">Tên sách</span><input value="Những ngày thơ ấu"></label>
<label class="field"><span class="lbl">Tác giả</span><input value="Nguyên Hồng"></label>
<div class="field"><span class="lbl">Thể loại</span><input value="Hồi ký"><div class="chips"><button class="box lbl" type="button">Tiểu thuyết</button><button class="box lbl on" type="button">Hồi ký</button><button class="box lbl" type="button">Thơ</button></div></div>
<button class="ed-reset" type="button">Lấy lại tên, tác giả, năm từ file gốc</button></div></div></div>
</body>
</html>
