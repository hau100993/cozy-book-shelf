<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>TourCard — preview</title>
<style>body{padding:16px;background:var(--paper)}</style></head>
<body>
<div style="padding:16px;background:rgba(20,20,20,.5)"><div class="t-card"><div class="t-scene" aria-hidden="true"><svg width="100%" height="150" viewBox="0 0 440 150"><rect x="122" y="54" width="24" height="74" rx="2" style="fill:var(--cobalt)"/><rect x="150" y="40" width="24" height="88" rx="2" style="fill:var(--verm)"/><rect x="178" y="62" width="24" height="66" rx="2" style="fill:var(--cover-ochre)"/><rect x="206" y="48" width="24" height="80" rx="2" style="fill:var(--cover-teal)"/><rect x="234" y="58" width="24" height="70" rx="2" style="fill:var(--cover-wine)"/><rect x="262" y="44" width="24" height="84" rx="2" style="fill:var(--cover-ink)"/><line x1="90" y1="128.5" x2="350" y2="128.5" style="stroke:var(--rule)"/></svg></div>

</body>
</html>
