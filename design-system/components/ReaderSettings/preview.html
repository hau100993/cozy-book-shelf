<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>ReaderSettings — preview</title>
<style>body{padding:16px;background:var(--paper)}</style></head>
<body>
<div class="r-sheet"><div class="row"><span class="lbl">Cỡ chữ</span><div class="size"><button class="box" type="button" style="font:400 13px var(--font-serif)">A−</button><output>19</output><button class="box" type="button" style="font:400 19px var(--font-serif)">A+</button></div></div>
<div class="row"><span class="lbl">Giãn dòng</span><div class="seg"><button type="button">Hẹp</button><button type="button" class="on">Vừa</button><button type="button">Rộng</button></div></div>
<div class="row"><span class="lbl">Kiểu chữ</span><div class="seg"><button type="button" class="on" style="font-family:var(--font-serif);font-size:15px">Có chân</button><button type="button">Không chân</button></div></div>
<div class="row"><span class="lbl">Nền</span><div class="seg themes"><button type="button" class="on"><i style="background:#FBF8F1"></i>Giấy</button><button type="button"><i style="background:#F2E6CC"></i>Sepia</button><button type="button"><i style="background:#1F1E1B"></i>Tối</button></div></div>
<div class="row"><span class="lbl">Bố cục</span><div class="seg"><button type="button" class="on">Tự động</button><button type="button">1 trang</button><button type="button">2 trang</button></div><span class="hint">Khi cầm dọc luôn hiện 1 trang. 2 trang hiện khi xoay ngang.</span></div>
<div class="row"><button class="box lbl" type="button" style="justify-self:start">Phím tắt <kbd style="margin-left:4px">?</kbd></button></div></div>
</body>
</html>
