<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lật Trang Thử</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: label bar on top, the book (1 or 2 WebGL pages) centred, progress strip below. Reading themes are the app's own (paper / sepia / dark), set by JS on the tokens below. */
:root{
  --bg:#EDEBE6; --page:#FBF8F1; --ink:#1C1A17; --muted:#7A766D; --accent:#1F3FB0; --line:rgba(20,20,20,.88); --soft:rgba(20,20,20,.12); --sheet:#F7F4EE;
  --ease:cubic-bezier(.2,.8,.2,1);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;font-family:var(--sans);
  -webkit-font-smoothing:antialiased;transition:background-color .4s var(--ease);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,label:focus-within,textarea:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font:600 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.box{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;min-width:30px;padding:0 10px;border:1px solid var(--line);white-space:nowrap;color:var(--ink);cursor:pointer;box-sizing:border-box}
.box svg{display:block}
.box.on{background:var(--accent);border-color:var(--accent);color:var(--page)}
.box[disabled]{opacity:.35;cursor:default}

.bar{position:fixed;left:0;right:0;top:0;z-index:20;height:58px;box-sizing:content-box;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--bg);transition:transform .45s var(--ease),background-color .4s var(--ease)}
.bar .l,.bar .r{display:flex;gap:6px;align-items:center}
.bar .r{justify-self:end}
.bar .t{display:grid;gap:5px;justify-items:center;text-align:center;min-width:0}
.bar .t b{font:400 17px/1.15 var(--serif);max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t span{color:var(--accent);max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;height:54px;box-sizing:content-box;background:var(--bg);
  padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:14px;transition:transform .45s var(--ease),background-color .4s var(--ease)}
.foot .prog{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;max-width:56vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#seek{flex:1;min-width:0;accent-color:var(--accent)}
body.immersive .bar{transform:translateY(calc(-100% - 4px))}
body.immersive .foot{transform:translateY(calc(100% + 4px))}

#bookShadow{position:fixed;z-index:1;background:var(--page);transition:background-color .4s var(--ease);
  box-shadow:0 1px 0 rgba(20,16,10,.06),0 24px 44px -22px rgba(20,16,10,.5)}
#gl{position:fixed;left:0;top:0;z-index:2;touch-action:none}

.pop{position:fixed;z-index:50;display:flex;align-items:center;gap:4px;padding:6px;background:var(--ink);color:var(--page);
  box-shadow:0 14px 30px -12px rgba(0,0,0,.5);transform-origin:50% 100%;transform:scale(0);transition:transform .25s var(--ease)}
.pop.on{transform:scale(1)}
.pop .sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center}
.pop .sw i{width:16px;height:16px;border-radius:50%;display:block}
.pop .sw.cur{border-color:var(--page)}
.pop .sep{width:1px;height:20px;background:color-mix(in srgb,var(--page) 30%,transparent);margin:0 4px}
.pop .act{height:28px;padding:0 9px;color:var(--page)}
.pop .act:hover{background:color-mix(in srgb,var(--page) 14%,transparent)}

.scrim{position:fixed;inset:0;z-index:55;background:rgba(10,8,5,.32);visibility:hidden}
.scrim.on{visibility:visible}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:60;width:min(380px,88vw);background:var(--sheet);color:var(--ink);box-sizing:border-box;
  transform:translateX(-102%);transition:transform .45s var(--ease);display:grid;grid-template-rows:auto auto auto minmax(0,1fr);
  padding:calc(18px + env(safe-area-inset-top,0px)) 0 env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-shadow:20px 0 50px -30px rgba(0,0,0,.5)}
.drawer.on{transform:none}
.drawer h2{margin:0 22px 14px;font:400 26px/1.1 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.tabs{display:flex;margin:0 22px 8px;border-bottom:1px solid var(--soft)}
.tabs button{padding:10px 0;margin-right:18px;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.list{overflow:auto;padding:4px 0 24px;user-select:text;-webkit-user-select:text}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;text-align:left;padding:12px 22px;border-bottom:1px solid var(--soft);cursor:pointer}
.item:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.item.cur{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.item .tt{font:400 16px/1.35 var(--serif);min-width:0}
.item .pg{color:var(--muted);font-variant-numeric:tabular-nums;align-self:start;padding-top:3px}
.item .sub{grid-column:1/-1;color:var(--muted);font:400 13px/1.45 var(--sans)}
.item .nt{grid-column:1/-1;font:italic 400 14px/1.45 var(--serif);padding-left:10px;border-left:2px solid var(--accent)}
.item .q{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding:1px 3px}
.item .acts{grid-column:1/-1;display:flex;gap:16px}
.item .acts button{color:var(--muted)}
.item .acts button:hover{color:var(--ink)}
.empty{padding:28px 22px;color:var(--muted);font:400 15px/1.5 var(--serif);margin:0}

.settings{position:fixed;z-index:60;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  width:min(330px,calc(100vw - 32px));box-sizing:border-box;background:var(--sheet);color:var(--ink);padding:18px;display:grid;gap:16px;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.55);transform-origin:90% 0;transform:scale(0);transition:transform .3s var(--ease)}
.settings.on{transform:scale(1)}
.settings .row{display:grid;gap:8px}
.settings .row>span{color:var(--muted)}
.seg{display:flex}
.seg button{flex:1;height:34px;border:1px solid var(--line);margin-left:-1px;font:500 13px var(--sans)}
.seg button:first-child{margin-left:0}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--page)}
.seg button[disabled]{opacity:.35;cursor:default}
.size{display:flex;align-items:center;gap:8px}
.size .box{height:34px;min-width:44px}
.size output{flex:1;text-align:center;font:400 18px var(--serif);font-variant-numeric:tabular-nums}
.themes button{display:flex;align-items:center;justify-content:center;gap:6px;height:38px}
.themes i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.3);display:block}

.note{position:fixed;left:50%;bottom:0;z-index:70;width:min(560px,100vw);transform:translate(-50%,105%);transition:transform .45s var(--ease);
  background:var(--sheet);color:var(--ink);box-sizing:border-box;padding:20px max(22px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));display:grid;gap:12px;box-shadow:0 -20px 50px -30px rgba(0,0,0,.6)}
.note.on{transform:translate(-50%,0)}
.note blockquote{margin:0;padding-left:12px;border-left:3px solid var(--accent);font:italic 400 15px/1.5 var(--serif);max-height:6.2em;overflow:auto}
.note textarea{min-height:110px;resize:vertical;border:1px solid var(--line);background:var(--page);color:var(--ink);padding:10px;font:400 16px/1.5 var(--serif);border-radius:0;user-select:text;-webkit-user-select:text}
.note .acts{display:flex;justify-content:flex-end;gap:8px}
.note .acts .box{height:36px}

.msg{position:fixed;inset:0;z-index:80;display:grid;place-items:center;text-align:center;font:400 19px/1.5 var(--serif);padding:0 24px;visibility:hidden;background:var(--bg)}
.msg.on{visibility:visible}
.drop{position:fixed;inset:0;z-index:85;visibility:hidden;background:color-mix(in srgb,var(--bg) 88%,transparent);display:grid;place-items:center;color:var(--accent);font:400 34px/1.2 var(--serif);pointer-events:none}
.drop::before{content:"";position:absolute;inset:16px;border:1.5px dashed var(--accent)}
.drop.on{visibility:visible}
.toast{position:fixed;left:50%;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--page);padding:10px 14px;
  transform:translate(-50%,calc(100% + 140px));transition:transform .5s var(--ease);max-width:calc(100vw - 32px);line-height:1.4}
.toast.on{transform:translate(-50%,0)}
@media (max-width:640px){
  .lbl{font-size:9px}
  .bar .t b{font-size:15px;max-width:34vw}
  .bar .t span{max-width:34vw}
  .hide-s{display:none !important}
  .box{padding:0 8px}
  .foot .prog{max-width:50vw}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>

<header class="bar">
  <div class="l">
    <button class="box" id="tocBtn" type="button" aria-label="Mục lục, đánh dấu và tô sáng"><svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M0 1h16M0 6h16M0 11h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <label class="box lbl" for="fileIn" title="Mở PDF hoặc EPUB"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0v12M0 6h12" stroke="currentColor" stroke-width="1.4"/></svg><span class="hide-s">Mở sách</span></label>
    <input type="file" id="fileIn" accept=".pdf,.epub,application/pdf,application/epub+zip" hidden>
  </div>
  <div class="t"><b id="bookTitle"></b><span class="lbl" id="chapLbl"></span></div>
  <div class="r">
    <button class="box lbl hide-s" id="sampleBtn" type="button">Sách mẫu</button>
    <button class="box" id="setBtn" type="button" aria-label="Tuỳ chỉnh hiển thị" style="font:400 16px/1 var(--serif)">Aa</button>
    <button class="box" id="bmBtn" type="button" aria-label="Đánh dấu trang"><svg width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path id="bmIcon" d="M1 1h10v14l-5-4-5 4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
  </div>
</header>

<div id="bookShadow"></div>
<canvas id="gl"></canvas>

<footer class="foot">
  <span class="lbl prog" id="prog"></span>
  <input type="range" id="seek" min="0" max="0" value="0" aria-label="Nhảy tới trang">
</footer>

<div class="pop" id="pop" role="toolbar" aria-label="Tô sáng">
  <button class="sw" data-c="yellow" type="button" aria-label="Tô vàng"><i style="background:#F2C434"></i></button>
  <button class="sw" data-c="green" type="button" aria-label="Tô xanh lá"><i style="background:#6EB964"></i></button>
  <button class="sw" data-c="pink" type="button" aria-label="Tô hồng"><i style="background:#EC7091"></i></button>
  <button class="sw" data-c="blue" type="button" aria-label="Tô xanh dương"><i style="background:#5087E6"></i></button>
  <span class="sep"></span>
  <button class="act lbl" id="popNote" type="button">Ghi chú</button>
  <button class="act lbl" id="popCopy" type="button">Chép</button>
  <button class="act lbl" id="popDel" type="button">Xoá</button>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Mục lục, đánh dấu và tô sáng">
  <a href="../" class="lbl" style="margin:0 22px 12px;color:var(--accent);text-decoration:none">← Về Tủ Sách Nhỏ</a>
  <h2 id="drawerTitle"></h2>
  <div class="tabs lbl" role="tablist">
    <button data-tab="toc" class="on" type="button" role="tab">Mục lục</button>
    <button data-tab="bm" type="button" role="tab">Đánh dấu</button>
    <button data-tab="hl" type="button" role="tab">Tô sáng</button>
  </div>
  <div class="list" id="list"></div>
</aside>

<div class="settings" id="settings" role="dialog" aria-label="Tuỳ chỉnh hiển thị">
  <div class="row"><span class="lbl">Cỡ chữ</span>
    <div class="size"><button class="box" id="fsMinus" type="button" aria-label="Chữ nhỏ hơn" style="font:400 13px var(--serif)">A−</button><output id="fsVal"></output><button class="box" id="fsPlus" type="button" aria-label="Chữ lớn hơn" style="font:400 19px var(--serif)">A+</button></div></div>
  <div class="row"><span class="lbl">Giãn dòng</span><div class="seg" data-k="lh"><button type="button" data-v="1.4">Hẹp</button><button type="button" data-v="1.6">Vừa</button><button type="button" data-v="1.85">Rộng</button></div></div>
  <div class="row"><span class="lbl">Lề trang</span><div class="seg" data-k="margin"><button type="button" data-v="s">Hẹp</button><button type="button" data-v="m">Vừa</button><button type="button" data-v="l">Rộng</button></div></div>
  <div class="row"><span class="lbl">Kiểu chữ</span><div class="seg" data-k="font"><button type="button" data-v="serif" style="font-family:var(--serif);font-size:15px">Có chân</button><button type="button" data-v="sans">Không chân</button></div></div>
  <div class="row"><span class="lbl">Nền</span><div class="seg themes" data-k="theme"><button type="button" data-v="paper"><i style="background:#FBF8F1"></i>Giấy</button><button type="button" data-v="sepia"><i style="background:#F2E6CC"></i>Sepia</button><button type="button" data-v="dark"><i style="background:#1F1E1B"></i>Tối</button></div></div>
  <div class="row"><span class="lbl">Bố cục</span><div class="seg" data-k="layout"><button type="button" data-v="auto">Tự động</button><button type="button" data-v="single">1 trang</button><button type="button" data-v="spread">2 trang</button></div></div>
</div>

<div class="note" id="note" role="dialog" aria-label="Ghi chú">
  <span class="lbl" style="color:var(--muted)">Ghi chú cho đoạn tô sáng</span>
  <blockquote id="noteQuote"></blockquote>
  <textarea id="noteText" placeholder="Bạn nghĩ gì về đoạn này?"></textarea>
  <div class="acts"><button class="box lbl" id="noteCancel" type="button">Huỷ</button><button class="box lbl on" id="noteSave" type="button">Lưu ghi chú</button></div>
</div>

<div class="msg" id="msg"></div>
<div class="drop" id="drop">Thả PDF hoặc EPUB để đọc</div>
<div class="toast lbl" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SERIF = 'Newsreader, Georgia, serif', SANS = '"Inter Tight", system-ui, sans-serif';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const mod = (a, n) => ((a % n) + n) % n;
const wait = ms => new Promise(r => setTimeout(r, ms));
const KEY = 100000;
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

const THEMES = {
  paper: { bg:'#EDEBE6', page:'#FBF8F1', ink:'#1C1A17', muted:'#7A766D', accent:'#1F3FB0', line:'rgba(20,20,20,.88)', soft:'rgba(20,20,20,.12)', sheet:'#F7F4EE', spine:'rgba(70,50,25,.13)', scheme:'light' },
  sepia: { bg:'#E2D5BB', page:'#F4E9D2', ink:'#3A2E20', muted:'#86735A', accent:'#8A3B1E', line:'rgba(58,46,32,.85)', soft:'rgba(58,46,32,.15)', sheet:'#EFE3C9', spine:'rgba(90,60,25,.16)', scheme:'light' },
  dark:  { bg:'#121211', page:'#1F1E1B', ink:'#D9D3C6', muted:'#8F897E', accent:'#93A9F2', line:'rgba(217,211,198,.6)', soft:'rgba(217,211,198,.14)', sheet:'#262522', spine:'rgba(0,0,0,.4)', scheme:'dark' }
};
const HL = { yellow:'rgba(242,196,52,.42)', green:'rgba(110,185,100,.38)', pink:'rgba(236,112,145,.36)', blue:'rgba(80,135,230,.34)' };
const HL_DARK = { yellow:'rgba(242,196,52,.30)', green:'rgba(110,185,100,.30)', pink:'rgba(236,112,145,.30)', blue:'rgba(80,135,230,.34)' };
const settings = Object.assign({ fs:null, lh:1.6, margin:'m', font:'serif', theme:'paper', layout:'auto' }, store.get('lt-settings') || {});
const TH = () => THEMES[settings.theme] || THEMES.paper;

/* ---------------- sample book (original text) ---------------- */
const SAMPLE = { kind:'text', id:'sample', title:'Một trang giấy cong', author:'Ghi chép cho Tủ Sách Nhỏ', blocks:[
 { t:'h', level:1, kicker:'Chương một', text:'Vì sao lật trang lại dễ chịu' },
 { t:'p', text:'Khi đọc sách giấy, ta không chỉ đọc chữ. Ngón tay biết mình đang ở đâu trong cuốn sách nhờ độ dày của xấp giấy còn lại. Mắt bắt được mép trang hơi cong lên trước khi tay kịp lật. Những tín hiệu nhỏ ấy giúp não ghi nhớ vị trí của một đoạn văn: nó nằm ở nửa trên trang trái, ngay sau một đoạn hội thoại dài.' },
 { t:'p', text:'Màn hình điện thoại xoá gần hết những tín hiệu đó. Một cú vuốt chỉ thay khung chữ này bằng khung chữ khác, nhanh và gọn, nhưng không để lại cảm giác đã đi qua một tờ giấy. Hiệu ứng lật trang của Google Play Sách ra đời để trả lại một phần cảm giác ấy. Nó không giúp đọc nhanh hơn, nhưng làm việc chuyển trang có trọng lượng.' },
 { t:'p', text:'Điều thú vị là hiệu ứng này không cần mô phỏng vật lý thật. Không có lực hấp dẫn, không có độ cứng của giấy. Chỉ cần một hình học đủ đúng để mắt tin, cộng với ánh sáng và bóng đổ đặt đúng chỗ.' },
 { t:'p', text:'Trang bạn đang cầm trong tay chính là bản thử nghiệm của ý tưởng đó. Hãy kéo mép phải của trang sang trái thật chậm, rồi thả ra giữa chừng, để thấy tờ giấy cuộn lên và trả về như thế nào.' },
 { t:'h', level:1, kicker:'Chương hai', text:'Một tờ giấy quấn quanh hình trụ' },
 { t:'p', text:'Mô hình được dùng nhiều nhất cho hiệu ứng này rất đơn giản. Hãy tưởng tượng một chiếc ống hình trụ nằm ngang trên mặt trang, song song với nếp gập. Phần giấy nằm phía sau ống vẫn phẳng. Phần giấy vượt qua ống thì bị quấn quanh nó, giống như khi ta cuộn một tờ giấy quanh cây bút chì.' },
 { t:'p', text:'Với mỗi điểm trên trang, chương trình chỉ cần tính một con số: khoảng cách từ điểm đó tới trục của ống, đo theo hướng ngón tay kéo. Nếu khoảng cách âm, điểm vẫn nằm phẳng. Nếu dương, khoảng cách ấy được đổi thành một góc quay quanh ống. Góc càng lớn, điểm càng được nhấc cao và kéo ngược lại.' },

function prepBook(b){
  const out = [];

    out.push(bl);

  let words = 0, chapN = 0;
  out.forEach((bl, i) => {

/* ---------------- WebGL ---------------- */
const VS = `
attribute vec2 aUV;
uniform vec2 uView, uOrigin, uSize, uP, uN;
uniform mediump float uR;
uniform mediump float uCurl;
uniform mediump float uFlip;

uniform float uLayer;
varying vec2 vUV; varying float vCos; varying float vDist;
const float PI = 3.14159265;
void main(){

    float th = dist / uR;
    if (th < PI){ q.xy = base + uN * (uR * sin(th)); q.z = uR * (1.0 - cos(th)); c = cos(th); }
    else { q.xy = base - uN * (dist - PI * uR); q.z = 2.0 * uR; c = -1.0; }
  }
  vCos = c;
  vec2 sc = vec2(uOrigin.x + uFlip * q.x, uOrigin.y + q.y);
  float z = uLayer - q.z / (uSize.x * 6.0);

precision mediump float;
uniform sampler2D uTex; uniform sampler2D uBack; uniform vec3 uPaper;
uniform float uR, uCurl, uMode, uFlap, uFlip, uBackMode, uDark;
varying vec2 vUV; varying float vCos; varying float vDist;
void main(){
  vec2 fuv = vec2(uFlip > 0.0 ? vUV.x : 1.0 - vUV.x, vUV.y);
  vec3 col;
  float shAmt = uDark > 0.5 ? 0.6 : 0.42;
  if (uMode < 0.5){
    col = texture2D(uTex, fuv).rgb;
    if (uCurl > 0.5){
      float d = vDist - uR;
      float sh = d > 0.0 ? shAmt * exp(-d / (uR * 0.85 + 4.0)) : shAmt;
      col *= 1.0 - sh;
    }

    col = texture2D(uTex, fuv).rgb * (0.78 + 0.22 * vCos);
    if (uCurl > 0.5 && vDist < uFlap){
      float e = uFlap - vDist;
      col *= 1.0 - 0.24 * exp(-e / (8.0 + 0.25 * uR));
    }

      col = texture2D(uBack, buv).rgb * (0.84 + 0.16 * (-vCos));

      col = mix(uPaper, texture2D(uTex, fuv).rgb, 0.11) * (0.84 + 0.16 * (-vCos));

function initGL(){

function isBlank(i){ return i < 0 || i >= nPages; }
function texKey(i){ return isBlank(i) ? 'blank' + (isLeft(i) ? 'L' : 'R') : i; }
function getTex(i){
  const k = texKey(i);
  if (tex.has(k)){ const v = tex.get(k); tex.delete(k); tex.set(k, v); return v.t; }
  const v = { t: makeTex(pageCanvas(i)) }; tex.set(k, v);

}

  gl.bindTexture(gl.TEXTURE_2D, tex.get(k).t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, pageCanvas(i)); dirty = true;

function invalidateKeys(a, b){ pages.forEach((p, i) => { if (p.keyMax >= a && p.keyMin <= b) invalidate(i); }); }

/* ---------------- typesetting ---------------- */
function wrapWords(words, font, firstW, restW){
  meas.font = font; const sw = meas.measureText(' ').width;
  const lines = []; let curL = [], cw = 0, avail = firstW;
  words.forEach((t, idx) => {
    const w = meas.measureText(t).width;
    if (curL.length && cw + sw + w > avail){ lines.push({ ws:curL, width:cw, avail }); curL = []; cw = 0; avail = restW; }
    cw += (curL.length ? sw : 0) + w; curL.push({ t, w, idx });
  });
  if (curL.length) lines.push({ ws:curL, width:cw, avail, last:true });
  return { lines, sw };

function autoFs(){ return Math.round(clamp(W * 0.043, 15, 19)); }
function paginate(){

  const cw = W - 2*mx, maxY = H - mb;
  const fam = settings.font === 'sans' ? SANS : SERIF;
  const fBody = '400 ' + fs + 'px ' + fam;
  const P = (startKey) => ({ lines:[], imgs:[], keyMin:Infinity, keyMax:-Infinity, startKey });
  pages = [Object.assign(P(-1), { title:true })]; toc = [];
  let pg = null, y = 0, after = true;
  const newPage = k => { pg = P(k); pages.push(pg); y = mt; };
  const empty = () => !pg.lines.length && !pg.imgs.length;
  const addLine = (font, color, x0, base, ws, gap, bi, size) => {
    const words = []; let xx = x0;
    for (const w of ws){ const key = bi*KEY + w.idx; words.push({ t:w.t, w:w.w, x:xx, key }); pg.keyMin = Math.min(pg.keyMin, key); pg.keyMax = Math.max(pg.keyMax, key); xx += w.w + gap; }
    pg.lines.push({ font, color, y: base, fs: size, words, gap });
  };
  newPage(0);
  book.blocks.forEach((b, bi) => {
    const k0 = bi * KEY;
    if (b.t === 'chap'){ if (!empty()) newPage(k0); else pg.startKey = k0; toc.push({ label:b.label, page:pages.length - 1, bi }); after = true; return; }
    if (b.t === 'h'){
      const big = b.level <= 2, hs = Math.round(big ? fs * 1.7 : fs * 1.2), font = '400 ' + hs + 'px ' + SERIF;
      const { lines, sw } = wrapWords(b.words, font, cw, cw);
      if (big){
        if (!empty()) newPage(k0);
        y = mt + H * .08;
        if (b.kicker){ y += fs; pg.lines.push({ font:'600 ' + Math.round(fs*.62) + 'px ' + SANS, color:'accent', y, fs, words:[{ t:b.kicker.toUpperCase(), w:0, x:mx, key:null }], spacing: fs*.1, gap:0 }); y += fs * .9; }
      } else { y += lh * .5; if (y + lines.length * hs * 1.2 + lh * 2 > maxY) newPage(k0); }

      y += big ? lh * 1.2 : lh * .35; after = true; return;
    }
    if (b.t === 'img'){
      let w = Math.min(cw, b.img.width), h = w * b.img.height / b.img.width;
      const maxH = maxY - mt - lh; if (h > maxH){ h = maxH; w = h * b.img.width / b.img.height; }
      if (y + h > maxY) newPage(k0);
      pg.imgs.push({ img:b.img, x:mx + (cw - w)/2, y:y + lh*.25, w, h }); y += h + lh*.6; after = true; return;
    }

    lines.forEach((l, k) => {

      y += lh;

}

function onLong(p){

  if (book.kind === 'pdf'){ p.state = 'none'; toast('Tô sáng chữ hiện chỉ có với sách mẫu và EPUB.'); return; }
  const hp = pointToPage(p.x0, p.y0); if (!hp){ p.state = 'none'; return; }
  const w = wordAt(hp.i, hp.x, hp.y, true); if (!w){ p.state = 'none'; return; }
  p.state = 'select'; sel = { page: hp.i, a: w.key, b: w.key }; invalidate(hp.i);
  try { if (navigator.vibrate) navigator.vibrate(12); } catch(e){}
}
function beginDrag(p){
  let dir, origin, flip;
  if (!spread){ dir = p.x0 - PX > W * .5 ? 'fwd' : 'back'; origin = PX; flip = 1; }
  else { dir = p.x0 >= SPINE ? 'fwd' : 'back'; origin = SPINE; flip = dir === 'fwd' ? 1 : -1; }
  const ly0 = p.y0 - PY;
  const t = makeTurn(dir, ly0);
  if (!t){ p.state = 'none'; toast(dir === 'fwd' ? 'Hết sách rồi.' : 'Đây là trang đầu.'); return; }
  turn = t; p.state = 'turn'; p.origin = origin; p.flip = flip;
  p.lx0 = flip * (p.x0 - origin); p.ly0 = ly0;
  p.gain = t.startTurned ? clamp(2*W / Math.max(W - p.lx0, 1), 1, 2.6) : clamp(2*W / Math.max(p.lx0, 1), 1, 2.6);
}
canvas.addEventListener('pointermove', e => {
  const p = ptr; if (!p || p.id !== e.pointerId) return;
  const now = performance.now(), dt = Math.max(1, now - p.lt);
  p.vx = p.vx * .6 + ((e.clientX - p.lx) / dt) * .4; p.lx = e.clientX; p.lt = now;
  if (p.state === 'pending' && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 8){ clearTimeout(p.timer); beginDrag(p); }
  if (p.state === 'turn' && turn){
    const lx = p.flip * (e.clientX - p.origin), ly = e.clientY - PY;
    const F = { x: (turn.startTurned ? -W : W) + (lx - p.lx0) * p.gain, y: turn.corner.y + (ly - p.ly0) };
    turn.F = clampF(F, turn.corner); dirty = true;
  } else if (p.state === 'select' && sel){
    const hp = pointToPage(e.clientX, clamp(e.clientY, PY + 1, PY + H - 1));
    if (hp && hp.i === sel.page){ const w = wordAt(hp.i, hp.x, hp.y, true); if (w && w.key !== sel.b){ sel.b = w.key; invalidate(sel.page); } }
  }
});
function endPtr(e){
  const p = ptr; if (!p || p.id !== e.pointerId) return;
  ptr = null; clearTimeout(p.timer);
  if (p.state === 'consumed' || p.state === 'none') return;
  if (p.state === 'select'){ if (sel) openPop({ kind:'sel' }); return; }
  if (p.state === 'pending'){
    const hp = pointToPage(p.x0, p.y0);
    if (hp && book.kind !== 'pdf'){
      const w = wordAt(hp.i, hp.x, hp.y, false);
      if (w){ const h = data.hls.find(h => w.key >= h.a && w.key <= h.b); if (h){ openPop({ kind:'hl', hl:h, page:hp.i }); return; } }
    }
    const bookW = spread ? 2 * W : W, rx = (p.x0 - PX) / bookW;
    if (rx > .36 && rx < .64){ document.body.classList.toggle('immersive'); return; }
    tapTurn(rx >= .5 ? 'fwd' : 'back', p.y0 - PY); return;
  }
  if (p.state === 'turn' && turn){
    const pr = (W - turn.F.x) / (2*W), v = p.flip * p.vx;
    let toTurned;
    if (v < -.35) toTurned = true; else if (v > .35) toTurned = false;
    else toTurned = turn.startTurned ? pr > .82 : pr > .18;
    const dist = Math.abs(turn.F.x - (toTurned ? -W : W));
    animTo(toTurned, clamp(dist / (2*W) * 700, 180, 520));
  }
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);

/* ---------------- highlight popup ---------------- */
const popEl = $('#pop');
function selRange(){ return [Math.min(sel.a, sel.b), Math.max(sel.a, sel.b)]; }
function openPop(o){
  pop = o;
  let i, a, b;
  if (o.kind === 'sel'){ i = sel.page; [a, b] = selRange(); }
  else { a = o.hl.a; b = o.hl.b; i = o.page; }
  popEl.querySelectorAll('.sw').forEach(s => s.classList.toggle('cur', o.kind === 'hl' && o.hl.color === s.dataset.c));
  $('#popDel').hidden = o.kind !== 'hl';
  $('#popNote').textContent = o.kind === 'hl' && o.hl.note ? 'Sửa ghi chú' : 'Ghi chú';
  const p = pages[i]; const rs = p ? hlRects(p, a, b) : [];
  let top = PY + H / 2, bottom = top, cx = vw / 2;
  if (rs.length){ top = PY + Math.min(...rs.map(r => r.y)); bottom = PY + Math.max(...rs.map(r => r.y + r.h)); const x0 = Math.min(...rs.map(r => r.x)), x1 = Math.max(...rs.map(r => r.x + r.w)); cx = pageToScreenX(i, (x0 + x1) / 2); }
  popEl.style.left = '0px'; popEl.style.top = '0px'; popEl.classList.add('on');
  const pw = popEl.offsetWidth, ph = popEl.offsetHeight;
  const minTop = 8 + (document.body.classList.contains('immersive') ? 0 : $('.bar').offsetHeight);
  let y = top - ph - 12, below = false;
  if (y < minTop){ y = bottom + 14; below = true; }
  popEl.style.transformOrigin = below ? '50% 0' : '50% 100%';
  popEl.style.left = clamp(cx - pw / 2, 8, vw - pw - 8) + 'px'; popEl.style.top = clamp(y, minTop, vh - ph - 8) + 'px';
}
function closePop(){ pop = null; popEl.classList.remove('on'); }
function clearSel(){ if (sel){ const i = sel.page; sel = null; invalidate(i); } }
function ensureHl(color){
  if (pop.kind === 'hl') return pop.hl;
  const [a, b] = selRange();
  const h = { id: Date.now().toString(36), a, b, color: color || 'yellow', note:'', text: textOf(a, b), t: Date.now() };
  const removed = data.hls.filter(x => !(x.b < a || x.a > b));
  data.hls = data.hls.filter(x => x.b < a || x.a > b); data.hls.push(h); data.hls.sort((x, y) => x.a - y.a);
  removed.forEach(x => invalidateKeys(x.a, x.b));
  saveData(); return h;
}
popEl.querySelectorAll('.sw').forEach(btn => btn.addEventListener('click', () => {
  if (!pop) return;
  const h = ensureHl(btn.dataset.c); h.color = btn.dataset.c; saveData();
  sel = null; closePop(); invalidateKeys(h.a, h.b);
}));
$('#popCopy').addEventListener('click', () => {
  if (!pop) return;
  const txt = pop.kind === 'hl' ? pop.hl.text : textOf(...selRange());
  try { navigator.clipboard.writeText(txt).then(() => toast('Đã chép đoạn chữ.'), () => toast('Trình duyệt không cho chép ở đây.')); } catch(e){ toast('Trình duyệt không cho chép ở đây.'); }
  clearSel(); closePop();
});
$('#popDel').addEventListener('click', () => {
  if (!pop || pop.kind !== 'hl') return;
  const h = pop.hl; data.hls = data.hls.filter(x => x !== h); saveData(); closePop(); invalidateKeys(h.a, h.b); toast('Đã xoá đoạn tô sáng.');
});
let noteHl = null;
$('#popNote').addEventListener('click', () => {
  if (!pop) return;
  const h = ensureHl(); sel = null; closePop(); invalidateKeys(h.a, h.b);
  openNote(h);
});
function openNote(h){
  noteHl = h; $('#noteQuote').textContent = h.text; $('#noteText').value = h.note || '';
  $('#note').classList.add('on'); $('#scrim').classList.add('on');
  setTimeout(() => $('#noteText').focus(), 320);
}
function closeNote(){ $('#note').classList.remove('on'); if (!$('#drawer').classList.contains('on')) $('#scrim').classList.remove('on'); noteHl = null; }
$('#noteCancel').addEventListener('click', closeNote);
$('#noteSave').addEventListener('click', () => {
  if (noteHl){ noteHl.note = $('#noteText').value.trim(); saveData(); invalidateKeys(noteHl.a, noteHl.b); toast(noteHl.note ? 'Đã lưu ghi chú.' : 'Đã xoá ghi chú.'); renderList(); }
  closeNote();
});

/* ---------------- bookmarks ---------------- */
function snippet(i){
  const p = pages[i]; if (!p || p.title) return book.title;
  const words = [];
  outer: for (const l of p.lines){ for (const w of l.words){ if (w.key != null) words.push(w.t); if (words.length > 22) break outer; } }
  return words.join(' ') + '…';
}
$('#bmBtn').addEventListener('click', () => {
  const vis = visiblePages();
  const marked = vis.filter(isBookmarked);
  if (marked.length){
    marked.forEach(i => { const hits = bmHits(i); data.bms = data.bms.filter(b => !hits.includes(b)); invalidate(i); });
    toast('Đã bỏ đánh dấu.');
  } else {
    const i = primaryPage(); if (isBlank(i)) return;
    if (book.kind === 'pdf') data.bms.push({ page:i, t:Date.now() });
    else { const p = pages[i]; data.bms.push({ key: p.title ? 0 : (isFinite(p.keyMin) ? p.keyMin : p.startKey), t:Date.now(), text: snippet(i) }); }
    invalidate(i); toast('Đã đánh dấu trang ' + (book.kind === 'pdf' ? i + 1 : i) + '.');
  }
  saveData(); dirty = true; updateUI(); renderList();
});

/* ---------------- drawer ---------------- */
let tab = 'toc';
function openDrawer(){ renderList(); $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); closeSettings(); closePop(); clearSel(); }
function closeDrawer(){ $('#drawer').classList.remove('on'); if (!$('#note').classList.contains('on')) $('#scrim').classList.remove('on'); }
$('#tocBtn').addEventListener('click', openDrawer);
$('#scrim').addEventListener('click', () => { closeDrawer(); closeNote(); closeSettings(); });
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); renderList(); }));
function pageLabel(i){ return book.kind === 'pdf' ? 'Tr. ' + (i + 1) : (i === 0 ? 'Bìa' : 'Tr. ' + i); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function renderList(){
  if (!book) return;
  const list = $('#list'); list.textContent = '';
  $('#drawerTitle').textContent = book.title;
  const mk = (cls, inner) => { const el = document.createElement('div'); el.className = 'item ' + (cls || ''); el.innerHTML = inner; el.tabIndex = 0; el.setAttribute('role', 'button'); return el; };
  const go = (el, i) => { const f = () => { jumpTo(i); closeDrawer(); }; el.addEventListener('click', e => { if (!e.target.closest('.acts button')) f(); }); el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target === el) f(); }); };
  if (tab === 'toc'){
    if (!toc.length){ list.innerHTML = '<p class="empty">Sách này không có mục lục.</p>'; return; }
    const pp = primaryPage(); let curT = null; for (const t of toc) if (t.page <= pp) curT = t;
    toc.forEach(t => { const el = mk(t === curT ? 'cur' : '', '<span class="tt">' + esc(t.label) + '</span><span class="lbl pg">' + pageLabel(t.page) + '</span>'); go(el, t.page); list.appendChild(el); });
  } else if (tab === 'bm'){
    const bms = data.bms.map(b => ({ b, i: book.kind === 'pdf' ? b.page : pageOfKey(b.key) })).sort((x, y) => x.i - y.i);
    if (!bms.length){ list.innerHTML = '<p class="empty">Chưa có trang nào được đánh dấu. Bấm biểu tượng ruy băng ở góc trên để đánh dấu trang đang đọc.</p>'; return; }
    bms.forEach(({ b, i }) => {
      const ch = book.kind === 'pdf' ? null : chapterOf(i);
      const el = mk('', '<span class="tt">' + esc(ch ? ch.label : 'Trang ' + (book.kind === 'pdf' ? i + 1 : i)) + '</span><span class="lbl pg">' + pageLabel(i) + '</span>' + (b.text ? '<span class="sub">' + esc(b.text) + '</span>' : '') + '<span class="acts lbl"><button type="button">Bỏ đánh dấu</button></span>');
      el.querySelector('.acts button').addEventListener('click', () => { data.bms = data.bms.filter(x => x !== b); saveData(); invalidate(i); updateUI(); renderList(); });
      go(el, i); list.appendChild(el);
    });
  } else {
    if (book.kind === 'pdf'){ list.innerHTML = '<p class="empty">Tô sáng và ghi chú hiện chỉ dùng được với sách mẫu và EPUB.</p>'; return; }
    if (!data.hls.length){ list.innerHTML = '<p class="empty">Chưa có đoạn tô sáng nào. Nhấn giữ một chữ trên trang rồi kéo để chọn đoạn văn.</p>'; return; }
    const hlc = settings.theme === 'dark' ? HL_DARK : HL;
    data.hls.forEach(h => {
      const i = pageOfKey(h.a);
      const el = mk('', '<span class="tt"><span class="q" style="background:' + hlc[h.color] + '">' + esc(h.text) + '</span></span><span class="lbl pg">' + pageLabel(i) + '</span>' + (h.note ? '<span class="nt">' + esc(h.note) + '</span>' : '') + '<span class="acts lbl"><button type="button" data-a="note">' + (h.note ? 'Sửa ghi chú' : '+ Ghi chú') + '</button><button type="button" data-a="rm">Xoá</button></span>');
      el.querySelector('[data-a="rm"]').addEventListener('click', () => { data.hls = data.hls.filter(x => x !== h); saveData(); invalidateKeys(h.a, h.b); renderList(); });
      el.querySelector('[data-a="note"]').addEventListener('click', () => openNote(h));
      go(el, i); list.appendChild(el);
    });
  }
}

/* ---------------- settings ---------------- */
const setEl = $('#settings');
function openSettings(){ syncSettings(); setEl.classList.add('on'); closePop(); clearSel(); }
function closeSettings(){ setEl.classList.remove('on'); }
$('#setBtn').addEventListener('click', () => { setEl.classList.contains('on') ? closeSettings() : openSettings(); });
document.addEventListener('pointerdown', e => { if (setEl.classList.contains('on') && !setEl.contains(e.target) && !$('#setBtn').contains(e.target)) closeSettings(); }, true);
function syncSettings(){
  const pdf = book.kind === 'pdf';
  $('#fsVal').textContent = pdf ? '—' : (settings.fs || autoFs()) + ' px';
  $('#fsMinus').disabled = $('#fsPlus').disabled = pdf;
  setEl.querySelectorAll('.seg').forEach(seg => {
    const k = seg.dataset.k; const textOnly = k === 'lh' || k === 'margin' || k === 'font';
    seg.querySelectorAll('button').forEach(b => { b.classList.toggle('on', String(settings[k]) === b.dataset.v); b.disabled = pdf && textOnly; });
  });
}
setEl.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const k = seg.dataset.k; settings[k] = k === 'lh' ? +b.dataset.v : b.dataset.v; saveSettings();
  if (k === 'theme') applyTheme();
  layout('key'); syncSettings();
}));
function bumpFs(d){ if (book.kind === 'pdf') return; settings.fs = clamp((settings.fs || autoFs()) + d, 12, 30); saveSettings(); layout('key'); syncSettings(); }
$('#fsMinus').addEventListener('click', () => bumpFs(-1));
$('#fsPlus').addEventListener('click', () => bumpFs(1));

/* ---------------- UI text ---------------- */
function updateUI(){
  $('#bookTitle').textContent = book.title;
  const pp = primaryPage();
  let chap = null; for (const t of toc) if (t.page <= pp) chap = t;
  $('#chapLbl').textContent = chap ? chap.label : (book.author || (book.kind === 'pdf' ? 'PDF' : ''));
  const vis = visiblePages();
  const nums = vis.map(i => book.kind === 'pdf' ? i + 1 : i);
  const total = book.kind === 'pdf' ? nPages : nPages - 1;
  const lastV = vis[vis.length - 1] ?? 0;
  const pct = Math.round(100 * lastV / Math.max(1, nPages - 1));
  let label = (nums[0] === 0 && book.kind !== 'pdf' && nums.length === 1 ? 'Bìa' : 'Trang ' + nums.filter(n => n > 0 || book.kind === 'pdf').join('–')) + ' / ' + total + ' · ' + pct + '%';
  if (book.kind !== 'pdf' && chap){
    const key = Math.max(0, currentKey() || 0); const bi = Math.floor(key / KEY);
    const nextCh = toc.find(t => t.bi > chap.bi); const endW = nextCh ? book.blocks[nextCh.bi].wb : book.totalWords;
    const curW = (book.blocks[bi] ? book.blocks[bi].wb : 0) + key % KEY;
    const mins = Math.ceil(Math.max(0, endW - curW) / 230);
    label += ' · ' + (mins <= 1 ? 'sắp hết chương' : 'hết chương sau ~' + mins + ' phút');
  }
  $('#prog').textContent = label;
  $('#seek').value = cur;
  const bm = vis.some(isBookmarked);
  $('#bmIcon').setAttribute('fill', bm ? 'currentColor' : 'none');
  $('#bmBtn').setAttribute('aria-pressed', bm ? 'true' : 'false');
}
let posT = 0;
function savePos(){ clearTimeout(posT); posT = setTimeout(() => { data.pos = book.kind === 'pdf' ? { page: cur } : { key: currentKey() }; saveData(); }, 300); }

/* ---------------- loop ---------------- */
function loop(now){
  if (turn && turn.anim){
    const a = turn.anim; const t = clamp((now - a.t0) / a.dur, 0, 1), e = a.ease(t);
    turn.F = { x: a.from.x + (a.to.x - a.from.x) * e, y: a.from.y + (a.to.y - a.from.y) * e + a.arc * Math.sin(Math.PI * t) };
    dirty = true;
    if (t >= 1) finishTurn();
  }
  if (dirty && gl){ dirty = false; render(); }
  requestAnimationFrame(loop);
}

/* ---------------- misc UI ---------------- */
$('#seek').addEventListener('input', e => jumpTo(+e.target.value));
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('textarea')){ if (e.key === 'Escape') closeNote(); return; }
  if (e.key === 'Escape'){ clearSel(); closePop(); closeDrawer(); closeSettings(); closeNote(); return; }
  if (e.target.closest && e.target.closest('input[type=range]')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); tapTurn('fwd'); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); tapTurn('back'); }
  else if (e.key === 'b' || e.key === 'B') $('#bmBtn').click();
});
let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => layout('key'), 140); });
let toastT = 0;
function toast(m, ms){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms || 2400); }
let wake = null;
function requestWake(){ if (wake || !navigator.wakeLock) return; navigator.wakeLock.request('screen').then(w => { wake = w; w.addEventListener('release', () => { wake = null; }); }).catch(() => {}); }

function setBook(b){
  if (book && book.kind === 'pdf' && book.doc && book !== b) try { book.doc.destroy(); } catch(e){}
  book = b.kind === 'text' && !b.prepped ? prepBook(b) : b;
  loadData(); cur = 0; sel = null; closePop();
  layout(null);
  if (data.pos){ cur = book.kind === 'pdf' ? (data.pos.page || 0) : pageOfKey(data.pos.key); normCur(); dirty = true; updateUI(); }
  syncSettings(); renderList();
}
async function openFile(f){
  if (!f) return;
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  toast('Đang mở “' + f.name + '”…', 60000);
  try {
    let b;
    if (ext === 'pdf') b = await openPdf(f);
    else if (ext === 'epub'){ b = await openEpub(f); if (!b.blocks.length) throw new Error('empty'); }
    else { toast('Chỉ mở được PDF hoặc EPUB.'); return; }
    setBook(b); toast('Đã mở “' + b.title + '”.');
  } catch(err){ toast('Không mở được file này. Có thể file bị hỏng hoặc có DRM.', 4200); }
}
$('#fileIn').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
$('#sampleBtn').addEventListener('click', () => setBook(SAMPLE));
let dd = 0; const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dd++; $('#drop').classList.add('on'); });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('dragleave', e => { if (!hasFiles(e)) return; dd = Math.max(0, dd - 1); if (!dd) $('#drop').classList.remove('on'); });
addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dd = 0; $('#drop').classList.remove('on'); openFile(e.dataTransfer.files[0]); });

async function boot(){
  try { if (!initGL()) throw new Error('no-webgl'); }
  catch(e){
    const m = $('#msg');
    m.textContent = gl ? 'Không khởi tạo được hiệu ứng lật trang: ' + (e && e.message ? e.message : e) : 'Trình duyệt này chưa bật WebGL nên không chạy được hiệu ứng lật trang.';
    m.classList.add('on'); return;
  }
  applyTheme();
  try { await Promise.race([Promise.all([document.fonts.load('400 18px "Newsreader"'), document.fonts.load('italic 400 18px "Newsreader"'), document.fonts.load('600 12px "Inter Tight"'), document.fonts.load('400 16px "Inter Tight"')]), wait(2500)]); } catch(e){}
  setBook(SAMPLE);
  requestAnimationFrame(loop);
}
boot();
})();
</script>
